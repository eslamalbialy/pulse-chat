<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PulseChat - الدردشات</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Cairo', sans-serif; }
    .chat-bg {
      background-color: #0b141a;
      background-image: radial-gradient(#202c33 1px, transparent 1px);
      background-size: 18px 18px;
    }
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-thumb { background: #2a3942; border-radius: 4px; }
  </style>
</head>
<body class="bg-[#111b21] text-gray-200 h-[100dvh] w-screen overflow-hidden flex flex-col select-none">

  <div class="flex h-full w-full relative overflow-hidden">

    <!-- القائمة الجانبية (تأخذ الشاشة كاملة في الموبايل وتختفي عند فتح شات) -->
    <div id="sidebar-panel" class="w-full md:w-[380px] lg:w-[420px] bg-[#111b21] border-l border-[#222e35] flex flex-col h-full flex-shrink-0 z-20 transition-all">
      
      <!-- هيدر البروفايل الشخصي -->
      <div class="bg-[#202c33] px-4 py-3 flex items-center justify-between border-b border-[#222e35]">
        <div id="btn-open-profile" class="flex items-center gap-3 cursor-pointer hover:opacity-90 transition">
          <img id="my-avatar" src="https://ui-avatars.com/api/?name=User&background=00a884&color=fff" class="w-11 h-11 rounded-full object-cover border border-emerald-500/40">
          <div>
            <div id="my-name" class="font-bold text-sm text-white leading-tight">جاري التحميل...</div>
            <div id="my-bio" class="text-[11px] text-emerald-400 truncate max-w-[160px]">متصل الآن</div>
          </div>
        </div>
        <div class="flex items-center gap-2">
          <button id="btn-new-group" title="إنشاء جروب جديد" class="w-9 h-9 rounded-full hover:bg-[#2a3942] text-gray-300 flex items-center justify-center transition">
            <i class="fa-solid fa-users-medical text-sm"></i>
          </button>
          <button id="btn-open-profile-icon" title="تعديل البروفايل" class="w-9 h-9 rounded-full hover:bg-[#2a3942] text-gray-300 flex items-center justify-center transition">
            <i class="fa-solid fa-gear text-sm"></i>
          </button>
          <button id="btn-logout" title="تسجيل الخروج" class="w-9 h-9 rounded-full hover:bg-red-500/20 text-red-400 flex items-center justify-center transition">
            <i class="fa-solid fa-power-off text-sm"></i>
          </button>
        </div>
      </div>

      <!-- شريط التبويبات للتنقل السريع -->
      <div class="flex bg-[#182229] border-b border-[#222e35] text-xs font-bold text-gray-400">
        <button id="tab-chats" class="flex-1 py-3 text-emerald-400 border-b-2 border-emerald-500 flex items-center justify-center gap-1.5 transition">
          <i class="fa-solid fa-comments"></i> الدردشات والجروبات
        </button>
        <button id="tab-users" class="flex-1 py-3 hover:text-gray-200 border-b-2 border-transparent flex items-center justify-center gap-1.5 transition">
          <i class="fa-solid fa-user-group"></i> كل الأعضاء (<span id="users-count">0</span>)
        </button>
      </div>

      <!-- شريط البحث -->
      <div class="p-2.5 bg-[#111b21] border-b border-[#222e35]">
        <div class="relative">
          <i class="fa-solid fa-magnifying-glass absolute right-3.5 top-2.5 text-gray-500 text-xs"></i>
          <input type="text" id="search-input" placeholder="ابحث عن شخص أو محادثة..." class="w-full bg-[#202c33] text-xs text-gray-200 placeholder-gray-500 pr-9 pl-3 py-2 rounded-lg focus:outline-none">
        </div>
      </div>

      <!-- القوائم -->
      <div class="flex-1 overflow-y-auto divide-y divide-[#1f2c33]">
        
        <!-- تبويب 1: المجتمع العام + الجروبات + المحادثات النشطة -->
        <div id="view-chats">
          <!-- زر المجتمع العام الثابت -->
          <div id="item-global" class="flex items-center gap-3.5 p-3.5 hover:bg-[#202c33] cursor-pointer bg-[#2a3942]/40 transition">
            <div class="w-12 h-12 rounded-full bg-gradient-to-tr from-emerald-600 to-teal-400 flex items-center justify-center text-white text-xl shadow-md flex-shrink-0">
              <i class="fa-solid fa-earth-americas"></i>
            </div>
            <div class="flex-1 min-w-0">
              <div class="flex justify-between items-center mb-0.5">
                <span class="font-bold text-sm text-white">المجتمع العام 🌍</span>
                <span class="text-[10px] bg-emerald-500/20 text-emerald-400 px-2 py-0.5 rounded-full">مفتوح للكل</span>
              </div>
              <p class="text-xs text-gray-400 truncate">غرفة الدردشة الجماعية لكل أعضاء الموقع</p>
            </div>
          </div>

          <!-- عنوان الجروبات والمحادثات الخاصة -->
          <div class="px-4 py-2 bg-[#182229] text-[11px] font-bold text-gray-400 flex justify-between items-center">
            <span>الجروبات والمحادثات الخاصة</span>
          </div>
          <div id="my-rooms-list" class="divide-y divide-[#1f2c33]"></div>
        </div>

        <!-- تبويب 2: كل المستخدمين المسجلين على الموقع -->
        <div id="view-users" class="hidden divide-y divide-[#1f2c33]"></div>

      </div>
    </div>

    <!-- نافذة المحادثة (تكون مخفية في الموبايل وتظهر بملء الشاشة عند اختيار محادثة) -->
    <div id="chat-panel" class="hidden md:flex flex-1 flex-col h-full bg-[#0b141a] z-30 w-full">
      
      <!-- هيدر المحادثة العلوية -->
      <div class="bg-[#202c33] px-3 py-2.5 flex items-center justify-between border-b border-[#222e35] shadow-sm">
        <div class="flex items-center gap-2.5">
          <!-- زر الرجوع للموبايل فقط -->
          <button id="btn-back-mobile" class="md:hidden w-9 h-9 rounded-full hover:bg-[#2a3942] text-gray-200 flex items-center justify-center">
            <i class="fa-solid fa-arrow-right"></i>
          </button>
          <img id="chat-header-avatar" src="https://ui-avatars.com/api/?name=Global&background=00a884&color=fff" class="w-10 h-10 rounded-full object-cover">
          <div>
            <h2 id="chat-header-title" class="font-bold text-sm text-white leading-tight">المجتمع العام 🌍</h2>
            <p id="chat-header-sub" class="text-[11px] text-gray-400">متاح لجميع الأعضاء المسجلين</p>
          </div>
        </div>
      </div>

      <!-- صندوق الرسائل -->
      <div id="messages-box" class="flex-1 overflow-y-auto p-3 md:p-5 space-y-2.5 chat-bg flex flex-col">
        <!-- الرسائل تضاف هنا تلقائياً -->
      </div>

      <!-- شريط الكتابة والإرسال -->
      <form id="message-form" class="bg-[#202c33] p-2.5 md:p-3 flex items-center gap-2 border-t border-[#222e35]">
        <input 
          type="text" 
          id="message-input" 
          placeholder="اكتب رسالتك هنا..." 
          autocomplete="off"
          class="flex-1 bg-[#2a3942] text-white placeholder-gray-400 text-sm px-4 py-2.5 rounded-full focus:outline-none focus:ring-1 focus:ring-emerald-500"
        >
        <button type="submit" class="w-11 h-11 rounded-full bg-emerald-600 hover:bg-emerald-500 text-white flex items-center justify-center shadow-md transition flex-shrink-0">
          <i class="fa-solid fa-paper-plane text-sm"></i>
        </button>
      </form>
    </div>

  </div>

  <!-- نافذة تعديل البروفايل الشخصي -->
  <div id="modal-profile" class="fixed inset-0 bg-black/70 hidden items-center justify-center z-50 p-4">
    <div class="bg-[#202c33] w-full max-w-sm rounded-2xl p-5 border border-[#2a3942] shadow-2xl">
      <div class="flex justify-between items-center mb-4 pb-2 border-b border-[#2a3942]">
        <h3 class="font-bold text-white text-base">تعديل الملف الشخصي</h3>
        <button id="close-profile-modal" class="text-gray-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
      </div>
      <div class="space-y-3.5 text-xs">
        <div>
          <label class="block text-gray-400 mb-1">اسم العرض</label>
          <input type="text" id="prof-name" class="w-full bg-[#111b21] border border-[#2a3942] rounded-xl p-2.5 text-white focus:outline-none focus:border-emerald-500">
        </div>
        <div>
          <label class="block text-gray-400 mb-1">نبذة عنك (Bio)</label>
          <input type="text" id="prof-bio" placeholder="متاح للدردشة..." class="w-full bg-[#111b21] border border-[#2a3942] rounded-xl p-2.5 text-white focus:outline-none focus:border-emerald-500">
        </div>
        <div>
          <label class="block text-gray-400 mb-1">رابط صورة البروفايل (اختياري)</label>
          <input type="url" id="prof-avatar" placeholder="https://..." class="w-full bg-[#111b21] border border-[#2a3942] rounded-xl p-2.5 text-white focus:outline-none focus:border-emerald-500">
        </div>
        <button id="save-profile-btn" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2.5 rounded-xl mt-2 transition">حفظ التعديلات</button>
      </div>
    </div>
  </div>

  <!-- نافذة إنشاء جروب جديد وإضافة أعضاء -->
  <div id="modal-group" class="fixed inset-0 bg-black/70 hidden items-center justify-center z-50 p-4">
    <div class="bg-[#202c33] w-full max-w-sm rounded-2xl p-5 border border-[#2a3942] shadow-2xl flex flex-col max-h-[85vh]">
      <div class="flex justify-between items-center mb-3 pb-2 border-b border-[#2a3942]">
        <h3 class="font-bold text-white text-base">إنشاء جروب جديد</h3>
        <button id="close-group-modal" class="text-gray-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
      </div>
      <div class="space-y-3 text-xs flex-1 overflow-hidden flex flex-col">
        <div>
          <label class="block text-gray-400 mb-1">اسم الجروب</label>
          <input type="text" id="group-name-input" placeholder="مثال: شلة الصحاب، مبرمجين..." class="w-full bg-[#111b21] border border-[#2a3942] rounded-xl p-2.5 text-white focus:outline-none focus:border-emerald-500">
        </div>
        <label class="block text-gray-400">اختر الأعضاء لإضافتهم للجروب:</label>
        <div id="group-members-select" class="flex-1 overflow-y-auto bg-[#111b21] rounded-xl p-2 divide-y divide-[#1f2c33] border border-[#2a3942]">
          <!-- قائمة الأعضاء للاختيار -->
        </div>
        <button id="create-group-confirm" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2.5 rounded-xl transition">إنشاء الجروب الآن</button>
      </div>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
