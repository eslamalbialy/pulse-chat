<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PulseChat — Login & Registration</title>
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
  </style>
</head>
<body class="min-h-screen bg-slate-50 text-slate-900 flex flex-col justify-between">
  <!-- Top Bar -->
  <header class="flex items-center justify-between gap-8 px-6 py-4 bg-white border-b border-slate-200">
    <a href="index.html" class="text-lg font-bold tracking-tight text-slate-900 whitespace-nowrap shrink-0">
      PulseChat
    </a>
    <nav class="hidden md:flex items-center gap-6 text-sm font-medium text-slate-600">
      <a href="#features" class="hover:text-slate-900 transition-colors whitespace-nowrap shrink-0">Features</a>
      <a href="#security" class="hover:text-slate-900 transition-colors whitespace-nowrap shrink-0">Security</a>
      <a href="chat.html" class="hover:text-slate-900 transition-colors whitespace-nowrap shrink-0">Chat Room</a>
    </nav>
    <div class="flex items-center gap-3 shrink-0">
      <span class="text-xs text-slate-500 whitespace-nowrap shrink-0">Vanilla JS + Firebase CDN</span>
    </div>
  </header>

  <!-- Main Auth Card -->
  <main class="flex-1 flex items-center justify-center p-6">
    <div class="w-full max-w-md bg-white border border-slate-200 rounded-xl p-8">
      <div class="mb-6">
        <p class="text-xs font-medium text-blue-600 mb-1">Real-Time Web Messenger</p>
        <h1 id="auth-title" class="text-2xl font-bold text-slate-900 tracking-tight">Sign in to your account</h1>
        <p id="auth-subtitle" class="text-sm text-slate-600 mt-1">
          Enter your email and password below to join the live chat room.
        </p>
      </div>

      <!-- Mode Switch Tabs -->
      <div class="grid grid-cols-2 gap-1 p-1 bg-slate-100 rounded-lg mb-6">
        <button
          type="button"
          id="tab-login"
          class="py-2 px-4 text-xs font-semibold rounded-md bg-white text-slate-900 shadow-sm transition-colors whitespace-nowrap"
        >
          Sign In
        </button>
        <button
          type="button"
          id="tab-register"
          class="py-2 px-4 text-xs font-semibold rounded-md text-slate-600 hover:text-slate-900 transition-colors whitespace-nowrap"
        >
          Create Account
        </button>
      </div>

      <!-- Error / Status Alert Box -->
      <div id="auth-alert" class="hidden mb-4 p-3 rounded-lg border text-xs font-medium"></div>

      <!-- Authentication Form -->
      <form id="auth-form" class="space-y-4">
        <div id="name-field-wrapper" class="hidden">
          <label for="displayName" class="block text-xs font-semibold text-slate-700 mb-1.5">
            Display Name
          </label>
          <input
            type="text"
            id="displayName"
            maxlength="60"
            placeholder="e.g. Alex Rivera"
            class="w-full px-3.5 py-2.5 text-sm bg-white border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-600 focus:border-transparent"
          />
        </div>

        <div>
          <label for="email" class="block text-xs font-semibold text-slate-700 mb-1.5">
            Email Address
          </label>
          <input
            type="email"
            id="email"
            required
            placeholder="you@example.com"
            class="w-full px-3.5 py-2.5 text-sm bg-white border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-600 focus:border-transparent"
          />
        </div>

        <div>
          <label for="password" class="block text-xs font-semibold text-slate-700 mb-1.5">
            Password
          </label>
          <input
            type="password"
            id="password"
            required
            minlength="6"
            placeholder="Minimum 6 characters"
            class="w-full px-3.5 py-2.5 text-sm bg-white border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-600 focus:border-transparent"
          />
        </div>

        <button
          type="submit"
          id="submit-btn"
          class="w-full py-2.5 px-4 bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold rounded-lg transition-colors cursor-pointer"
        >
          Sign In to Chat
        </button>
      </form>

      <div class="relative my-6">
        <div class="absolute inset-0 flex items-center">
          <div class="w-full border-t border-slate-200"></div>
        </div>
        <div class="relative flex justify-center text-xs">
          <span class="bg-white px-2 text-slate-500">Or continue with</span>
        </div>
      </div>

      <button
        type="button"
        id="google-btn"
        class="w-full py-2.5 px-4 bg-white hover:bg-slate-50 text-slate-800 text-sm font-semibold border border-slate-300 rounded-lg transition-colors flex items-center justify-center gap-2 cursor-pointer"
      >
        <span>Sign in with Google</span>
      </button>
    </div>
  </main>

  <footer class="py-4 px-6 text-center text-xs text-slate-500 border-t border-slate-200 bg-white">
    PulseChat Vanilla JS Starter · Powered by Firebase Auth &amp; Cloud Firestore
  </footer>

  <!-- Load our Vanilla JS Application Logic as an ES Module -->
  <script type="module" src="./app.js"></script>
</body>
</html>
