<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PulseChat - تسجيل الدخول</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Cairo', sans-serif; }
  </style>
</head>
<body class="bg-[#0b141a] text-gray-100 min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-md bg-[#111b21] rounded-2xl shadow-2xl border border-[#222e35] overflow-hidden">
    
    <!-- الهيدر والشعار -->
    <div class="bg-[#202c33] p-6 text-center border-b border-[#222e35]">
      <div class="w-16 h-16 rounded-full bg-emerald-600 mx-auto flex items-center justify-center text-white text-3xl shadow-lg mb-3">
        <i class="fa-brands fa-whatsapp"></i>
      </div>
      <h1 class="text-2xl font-bold text-white tracking-wide">PulseChat</h1>
      <p class="text-xs text-gray-400 mt-1">تواصل مع أصدقائك ومجتمعك في الوقت الفعلي</p>
    </div>

    <!-- تبويبات تسجيل الدخول وإنشاء الحساب -->
    <div class="flex border-b border-[#222e35] bg-[#182229] text-sm font-semibold">
      <button type="button" id="tab-login" class="flex-1 py-3.5 text-emerald-400 border-b-2 border-emerald-500 transition">تسجيل دخول</button>
      <button type="button" id="tab-register" class="flex-1 py-3.5 text-gray-400 border-b-2 border-transparent hover:text-gray-200 transition">حساب جديد</button>
    </div>

    <!-- النموذج -->
    <div class="p-6">
      <div id="auth-error" class="hidden mb-4 p-3 rounded-lg bg-red-500/10 border border-red-500/30 text-red-400 text-xs text-center"></div>

      <form id="auth-form" class="space-y-4">
        <div id="name-field" class="hidden">
          <label class="block text-xs text-gray-400 mb-1">الاسم بالكامل (سيظهر للناس)</label>
          <div class="relative">
            <i class="fa-solid fa-user absolute right-3.5 top-3 text-gray-500 text-sm"></i>
            <input type="text" id="auth-name" placeholder="مثال: إسلام البيلي" class="w-full bg-[#202c33] text-sm text-white rounded-xl pr-10 pl-4 py-2.5 border border-[#2a3942] focus:outline-none focus:border-emerald-500">
          </div>
        </div>

        <div>
          <label class="block text-xs text-gray-400 mb-1">البريد الإلكتروني</label>
          <div class="relative">
            <i class="fa-solid fa-envelope absolute right-3.5 top-3 text-gray-500 text-sm"></i>
            <input type="email" id="auth-email" required placeholder="example@gmail.com" class="w-full bg-[#202c33] text-sm text-white rounded-xl pr-10 pl-4 py-2.5 border border-[#2a3942] focus:outline-none focus:border-emerald-500">
          </div>
        </div>

        <div>
          <label class="block text-xs text-gray-400 mb-1">كلمة المرور</label>
          <div class="relative">
            <i class="fa-solid fa-lock absolute right-3.5 top-3 text-gray-500 text-sm"></i>
            <input type="password" id="auth-password" required placeholder="••••••••" class="w-full bg-[#202c33] text-sm text-white rounded-xl pr-10 pl-4 py-2.5 border border-[#2a3942] focus:outline-none focus:border-emerald-500">
          </div>
        </div>

        <button type="submit" id="auth-submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-xl shadow-lg transition flex items-center justify-center gap-2 text-sm mt-2">
          <span>دخول إلى الدردشة</span>
          <i class="fa-solid fa-arrow-left text-xs"></i>
        </button>
      </form>
    </div>

  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
