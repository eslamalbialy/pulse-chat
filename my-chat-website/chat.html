<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PulseChat — Live Chat Room</title>
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .tabular-nums { font-variant-numeric: tabular-nums; font-family: 'IBM Plex Mono', monospace; }
  </style>
</head>
<body class="h-screen bg-slate-50 text-slate-900 flex flex-col overflow-hidden">
  <!-- Top Bar -->
  <header class="flex items-center justify-between gap-8 px-6 py-3.5 bg-white border-b border-slate-200 shrink-0">
    <div class="flex items-center gap-4">
      <a href="chat.html" class="text-lg font-bold tracking-tight text-slate-900 whitespace-nowrap shrink-0">
        PulseChat
      </a>
      <span class="text-slate-300">·</span>
      <span id="current-room-label" class="text-sm font-medium text-slate-600 whitespace-nowrap">#general</span>
    </div>

    <div class="flex items-center gap-4 shrink-0">
      <span id="user-badge" class="text-xs font-medium text-slate-600 whitespace-nowrap">Connecting...</span>
      <button
        type="button"
        id="logout-btn"
        class="px-3.5 py-1.5 text-xs font-semibold text-slate-700 bg-slate-100 hover:bg-slate-200 rounded-lg transition-colors whitespace-nowrap cursor-pointer"
      >
        Sign Out
      </button>
    </div>
  </header>

  <!-- Main Workspace Layout -->
  <div class="flex-1 flex overflow-hidden">
    <!-- Sidebar: Channels -->
    <aside class="w-64 bg-white border-r border-slate-200 flex flex-col justify-between p-4 hidden md:flex shrink-0">
      <div>
        <h2 class="text-xs font-semibold text-slate-500 px-2 mb-2">Channels</h2>
        <nav id="channel-list" class="space-y-1">
          <button data-room="general" class="room-btn w-full text-left px-3 py-2 rounded-lg text-sm font-semibold bg-blue-50 text-blue-700 transition-colors">
            # general
          </button>
          <button data-room="beginners-help" class="room-btn w-full text-left px-3 py-2 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-100 transition-colors">
            # beginners-help
          </button>
          <button data-room="project-showcase" class="room-btn w-full text-left px-3 py-2 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-100 transition-colors">
            # project-showcase
          </button>
          <button data-room="random" class="room-btn w-full text-left px-3 py-2 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-100 transition-colors">
            # random
          </button>
        </nav>
      </div>

      <div class="pt-4 border-t border-slate-200 text-xs text-slate-500 space-y-1">
        <p class="font-medium text-slate-700">Real-Time Firestore Sync</p>
        <p>Messages update automatically across all browser tabs.</p>
      </div>
    </aside>

    <!-- Center: Message Feed & Composer -->
    <main class="flex-1 flex flex-col bg-slate-50 overflow-hidden">
      <!-- Error Banner -->
      <div id="chat-alert" class="hidden m-4 p-3 rounded-lg border border-red-200 bg-red-50 text-xs text-red-700"></div>

      <!-- Scrollable Messages Container -->
      <div id="messages-container" class="flex-1 overflow-y-auto p-6 space-y-4">
        <div class="text-center py-12 text-sm text-slate-500">Loading real-time messages...</div>
      </div>

      <!-- Message Input Composer -->
      <form id="message-form" class="p-4 bg-white border-t border-slate-200 flex items-center gap-3 shrink-0">
        <input
          type="text"
          id="message-input"
          required
          maxlength="1000"
          autocomplete="off"
          placeholder="Write a message in #general..."
          class="flex-1 px-4 py-2.5 text-sm bg-slate-50 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-600 focus:bg-white transition-colors"
        />
        <button
          type="submit"
          id="send-btn"
          class="px-5 py-2.5 bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold rounded-lg transition-colors whitespace-nowrap shrink-0 cursor-pointer"
        >
          Send Message
        </button>
      </form>
    </main>
  </div>

  <!-- Load our Vanilla JS Application Logic as an ES Module -->
  <script type="module" src="./app.js"></script>
</body>
</html>
